<!doctype html>
<html lang="en" style="background-color: #191c1f">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#191c1f" />
    <meta name="application-name" content="Navi" />
    <meta name="apple-mobile-web-app-title" content="Navi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/navi-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/navi-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon-precomposed" href="/navi-touch-icon.png" />
    <link
      rel="apple-touch-startup-image"
      href="/ios-splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/ios-splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/ios-splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/ios-splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/ios-splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <title>Navi</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #191c1f;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #191c1f;
      }
      #boot-screen .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #boot-screen .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: #083b3a;
        box-shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.55);
      }
      #boot-screen .mark img {
        width: 42px;
        height: 42px;
        display: block;
      }
      #boot-screen .label {
        font:
          800 11px/1 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body class="antialiased selection:bg-primary/30 text-foreground bg-[#191c1f]">
    <div id="boot-screen" aria-hidden="true">
      <div class="brand">
        <div class="mark">
          <img src="/navi-touch-icon.png" alt="" />
        </div>
        <div class="label">Loading</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
