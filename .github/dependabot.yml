# Dependabot version updates.
# Grouped so a small family project gets at most a couple of PRs a week
# instead of one per package. Security fixes are not grouped and arrive
# as soon as an advisory lands (requires Dependabot security updates to be
# enabled in the repo settings).
version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00" # UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps for everything, in one PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Major bumps of tightly coupled families land together.
      # Vite, its plugins and TanStack Start/Router depend on each other's
      # versions (e.g. @vitejs/plugin-react 6 and TanStack Start need vite 8),
      # so their majors must land in one PR or none of them can install.
      vite-and-tanstack:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@tanstack/*"
          - "@tailwindcss/vite"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"

  # Keep the CI workflow's actions (checkout, setup-bun) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00" # UTC
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
